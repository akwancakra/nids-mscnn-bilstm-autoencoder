paths:
  # Updated to point to the new Local/Colab processed data location
  train_data: "data/processed/train"
  test_data: "data/processed/test"
  output_dir: "output"
  model_save_path: "models/mscnn_bilstm_ae_best.h5"
  # Scaler saved by generate_sota_data.py
  scaler_path: "data/processed/scaler.pkl"

model:
  sequence_length: 10 # Default from script
  n_features: null    # Will be inferred
  encoding_dim: 16
  learning_rate: 0.0005

training:
  batch_size: 256     # Larger batch size for NPZ
  epochs: 50
  validation_split: 0.1 # We can use separate val shards actually
  patience: 5

thresholding:
  method: "percentile" 
  percentile: 99.9 # High percentile for robustness
